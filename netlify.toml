[build]
publish = "public"
functions = "functions"
command = "bash build.sh"

[context.deploy-preview]
command = "bash build.sh -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "bash build.sh -b $DEPLOY_PRIME_URL"

[context.next]
command = "bash build.sh"

[context.next.environment]
HUGO_ENV = "next"

[functions]
directory = "functions"
node_bundler = "esbuild"

[dev]
framework = "#custom"
command = "mise run dev"
targetPort = 1313
port = 8888
publish = "public"
autoLaunch = false

[[plugins]]
package = "@algolia/netlify-plugin-crawler"

[plugins.inputs]
branches = ['master']
disabled = false
renderJavaScript = true

[[plugins]]
package = "netlify-plugin-cloudinary"

[plugins.inputs]
cloudName = "dubu"
loadingStrategy = "lazy"
